[package]
name = "thrum-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# A standalone workspace on purpose: libFuzzer targets need nightly, which
# the main workspace must not require. See docs/decisions/0011.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
thrum-core = { path = "../crates/core" }
thrum-cli = { path = "../crates/cli" }
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "app_message"
path = "fuzz_targets/app_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frames"
path = "fuzz_targets/frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mls_process"
path = "fuzz_targets/mls_process.rs"
test = false
doc = false
bench = false

[[bin]]
name = "names"
path = "fuzz_targets/names.rs"
test = false
doc = false
bench = false
