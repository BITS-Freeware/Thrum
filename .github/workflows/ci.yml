name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      # The server test suite runs twice: against SQLite (default) and
      # against this PostgreSQL instance (THRUM_TEST_DB_URL below).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: thrum
          POSTGRES_DB: thrum_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Tests against PostgreSQL
        run: THRUM_TEST_DB_URL=postgres://thrum@localhost:5432/thrum_test cargo test -p thrum-server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the wasm package
        run: ./scripts/build-wasm.sh
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Typecheck and build the web client
        run: npm run build
        working-directory: web
      - name: Build the server binary
        run: cargo build -p thrum-server
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser e2e tests
        run: npx playwright test
        working-directory: web
