[package]
name = "thrum-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Thrum core: protocol types and client logic shared by all clients"

[dependencies]
aes-gcm = "0.10"
base64.workspace = true
openmls = "0.9.2"
openmls_basic_credential = { version = "0.6.0", features = ["clonable"] }
openmls_rust_crypto = "0.6.0"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Randomness on wasm targets: getrandom needs explicit opt-in features there
# (`js` for 0.2, `wasm_js` for 0.3+); several crates in the tree pull each
# major version, so both are enabled for wasm builds only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# openmls's `js` feature links web-time and wires its randomness for browsers.
openmls = { version = "0.9.2", features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
