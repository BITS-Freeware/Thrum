services:
  thrum:
    build: .
    # Published on loopback only. Put Caddy, nginx, or another TLS proxy
    # in front of this service before anyone reaches it from another
    # machine. The server speaks plain HTTP: a public 8080 sends passwords
    # and session tokens in the clear.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - thrum-data:/data
    environment:
      # SQLite by default. For PostgreSQL use the "postgres" profile and
      # uncomment:
      # THRUM_DB: postgres://thrum:thrum@postgres:5432/thrum
      THRUM_BLOB_BACKEND: disk
      # Behind a host proxy that overwrites X-Forwarded-For, trust the
      # Docker network so rate limits see real client addresses (see
      # docs/self-hosting.md, "TLS and reverse proxy"):
      # THRUM_TRUSTED_PROXIES: 172.16.0.0/12
    # The entrypoint needs these three to hand /data to the thrum user and
    # drop to it; the server itself runs with no capabilities.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "thrum-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    # With the postgres profile, start once PostgreSQL accepts connections.
    # Without it the dependency is skipped.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Optional: `docker compose --profile postgres up -d` switches the
  # server to PostgreSQL. The database lives in a named volume; the
  # credentials below are for the private compose network only.
  postgres:
    image: postgres:19@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: thrum
      POSTGRES_PASSWORD: thrum
      POSTGRES_DB: thrum
    volumes:
      - thrum-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "thrum", "-d", "thrum"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  thrum-data:
  thrum-postgres:
